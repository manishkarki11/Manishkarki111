<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
     role="img" aria-label="Manish Karki — creative developer profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset=".55" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".18" cy=".25" r=".55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".8" r=".55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-opacity=".45" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip">
      <rect x="24" y="24" width="1132" height="562" rx="22"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .name { font-size: 44px; font-weight: 700; fill: #F8FAFC; letter-spacing: .5px; }
      .headline { font-size: 15px; fill: #22D3EE; letter-spacing: 1.5px; }
      .label { font-size: 12px; fill: #64748B; letter-spacing: 1.2px; }
      .value { font-size: 13px; fill: #E2E8F0; }
      .sect { font-size: 11px; fill: #94A3B8; letter-spacing: 2px; }
      .ascii { font-size: 7.4px; fill: #67E8F9; letter-spacing: 0px; }
      .dim { font-size: 11px; fill: #64748B; }
      .pill { font-size: 10.5px; fill: #CBD5E1; }
    </style>
  </defs>

  <rect x="24" y="24" width="1132" height="562" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#frameClip)">
    <rect x="24" y="24" width="1132" height="562" fill="url(#grid)" opacity=".5"/>
    <rect x="24" y="24" width="1132" height="562" fill="url(#glowA)"/>
    <rect x="24" y="24" width="1132" height="562" fill="url(#glowB)"/>
    <rect x="24" y="24" width="1132" height="2" fill="url(#accent)" opacity=".25">
      <animate attributeName="y" values="24;586;24" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="24" y="24" width="1132" height="562" rx="22" fill="none" stroke="#1E293B" stroke-width="1"/>
  <rect x="24" y="24" width="1132" height="562" rx="22" fill="none" stroke="url(#accent)" stroke-width="1" opacity=".35"/>

  <!-- LEFT PANEL -->
  <g class="mono">
    <circle cx="66" cy="72" r="6" fill="#EF4444"/>
    <circle cx="88" cy="72" r="6" fill="#F59E0B"/>
    <circle cx="110" cy="72" r="6" fill="#10B981"/>
    <text x="150" y="77" class="dim">vaibhav@creative:~</text>
    <text x="1060" y="77" class="label" text-anchor="end">[ ONLINE ]</text>

    <rect x="48" y="100" width="440" height="462" rx="18"
          fill="#0F172A" fill-opacity=".35" stroke="#1E293B"/>
    <text x="72" y="128" class="sect">VISUAL.MAP</text>
    <line x1="72" y1="140" x2="464" y2="140" stroke="#1E293B"/>

    <rect x="72" y="152" width="392" height="290" rx="10"
          fill="none" stroke="#22D3EE" stroke-opacity=".25"/>

    <!-- ASCII portrait slot -->
    <g opacity="0">
      <text x="268" y="180" class="ascii" text-anchor="middle">
        {{ASCII_BLOCK}}
      </text>
      <animate attributeName="opacity" values="0;1" dur=".6s" begin=".2s" fill="freeze"/>
    </g>

    <text x="268" y="474" class="label" text-anchor="middle">[ CREATIVE DEVELOPER ]</text>
    <text x="268" y="500" class="value" text-anchor="middle">Cinematic · AI Workflows · Web</text>

    <text x="72" y="540" class="dim">~/profile $</text>
    <text x="168" y="540" class="value">build --ship</text>
    <rect x="278" y="528" width="8" height="14" fill="#22D3EE" opacity=".9">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- RIGHT PANEL -->
  <g class="mono">
    <g opacity="0">
      <text x="520" y="120" class="name">Manish karki</text>
      <text x="520" y="148" class="headline">CREATIVE DEVELOPER · CINEMATIC WEB · AI WORKFLOWS</text>
      <animate attributeName="opacity" values="0;1" dur=".5s" begin=".1s" fill="freeze"/>
    </g>

    <line x1="520" y1="168" x2="1132" y2="168" stroke="#1E293B"/>

    <text x="520" y="196" class="sect">SYSTEM.INFO</text>
    <text x="1132" y="196" class="dim" text-anchor="end">vaibhav@dev:~$ ./profile.sh</text>

    <g class="label" text-anchor="end">
      <text x="640" y="232">&gt; Name</text>
      <text x="640" y="262">&gt; ROLE</text>
      <text x="640" y="292">&gt; FOCUS</text>
      <text x="640" y="322">&gt; BUILDING</text>
      <text x="640" y="352">&gt; WRITING</text>
      <text x="640" y="382">&gt; CONTENT</text>
    </g>
    <g class="value">
      <text x="664" y="232">Manish Karki</text>
      <text x="664" y="262">Creative Developer</text>
      <text x="664" y="292">Cinematic websites · AI workflows</text>
      <text x="664" y="322">cinematic-portfolio</text>
      <text x="664" y="352">Medium · @manishkarki11</text>
      <text x="664" y="382">YouTube · Instagram · @Rootaccess</text>
    </g>

    <text x="520" y="418" class="sect">STACK</text>
    <g class="pill">
      <rect x="520" y="430" width="120" height="26" rx="13"
            fill="#0F172A" fill-opacity=".5" stroke="#22D3EE" stroke-opacity=".4"/>
      <text x="580" y="447" text-anchor="middle">Next.js</text>

      <rect x="652" y="430" width="120" height="26" rx="13"
            fill="#0F172A" fill-opacity=".5" stroke="#7C3AED" stroke-opacity=".4"/>
      <text x="712" y="447" text-anchor="middle">Three.js</text>

      <rect x="784" y="430" width="120" height="26" rx="13"
            fill="#0F172A" fill-opacity=".5" stroke="#10B981" stroke-opacity=".4"/>
      <text x="844" y="447" text-anchor="middle">React</text>

      <rect x="916" y="430" width="120" height="26" rx="13"
            fill="#0F172A" fill-opacity=".5" stroke="#22D3EE" stroke-opacity=".4"/>
      <text x="976" y="447" text-anchor="middle">GSAP</text>
    </g>

    <text x="520" y="492" class="sect">LINKS</text>
    <g class="dim" text-anchor="end">
      <text x="1132" y="492">github.com/manishkarki11</text>
      <text x="1132" y="514">manishkarki11-create.vercel.app</text>
      <text x="1132" y="536">linkedin.com/in/manishkarki</text>
      <text x="1132" y="558">medium.com/@manishkarki11</text>
    </g>
  </g>
</svg>
